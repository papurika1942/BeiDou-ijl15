[general]
;IME 修复方案，只有0和1两种，优先尝试方案1（更完美），如果会卡门再尝试方案0
imeType=1
;分辨率 (推荐值: 1280x720, 1366x768; 其他可选: 1600x900, 1920x1080, 1024x768; 不保证可用: 800x600)
width=1920
height=1080
;服务器地址
ServerIP_Address=127.0.0.1
serverIP_Port=8484
;加载文字汉化
SwitchChinese=true
;右下角消息数量
MsgAmount=10
;does your UI.wz include the MapleEzorsiaV2wzfiles.img? (true/false, default true if using UI.wz provided in setup guide)
EzorsiaV2WzIncluded=true
;is a resolution specific login frame being used in UI.wz? (true/false, default true if EzorsiaV2WzIncluded=true)
;somewhat obselete, mostly kept for ppl who wanna use their own login frame by directly editing the original frame in wz
CustomLoginFrame=true
;开启后登录界面的UI会按大边框布局，请确保UI使用了大边框才开启
bigLoginFrame=true
;窗口模式
WindowedMode=true
;跳过开头的动画
RemoveLogos=true
;Should VirtuProtect be enabled? (true/false, default true) (this is necessary for clients without CRC bypass such as hendi's clients
;that havent been editted further, can be turned off for clients with CRC bypass to save whatever processing power it uses)
UseVirtuProtect=true

[statusbar]
;底部状态栏水平位置：-1 = 自动（8键模式下自动居中 (width-800)/2；26键模式下自动左对齐 0 铺满屏幕不截断），>=0 为强制指定像素
StatusBarX=-1
;是否移动状态栏底板/背景（角色头像、LV框、角色名所在的面板随底板一起移动）
MoveBarFrame=true
;是否移动 HP/MP/EXP 条等元素
MoveBarItems=true
;底部输入框（对话栏）水平偏移（像素，正数=右移，负数=左移）
;默认 0 保持居中对齐；若配合特殊805px底图可微调。
;注意：该位置只在【创建状态栏时】读取一次，切分辨率不生效，需重启客户端（非 ReloadKey 生效项）。
ChatBoxX=0
;底部底图专属水平偏移（像素，正数=右移，负数=左移；底板/控件不动，只挪背景图）
;默认 0 完美居中；若底图超 800（如 805 宽）可设为 -4。
;注意：与 ChatBoxX 一样只在【创建状态栏时】用一次，需重启客户端。
BackgroundOffsetX=0

[quickslot]
;长键盘快捷栏（8格 -> 26格）开关：false = 保留原生 8 格
EnableLongSlot=false
;快捷栏整体水平微调（像素，正数右移、负数左移）。改完重启客户端生效。
;基准位置会随分辨率自动跟随底部状态栏居中（1280 宽下为 x=815，1600 宽下自动变为 975），
;这里填的只是额外微调量：默认 0 = 内置位置；例：-100 则整体左移 100px
QuickSlotX=75
;快捷栏整体垂直微调（像素，正数下移、负数上移）。改完重启客户端生效。
;默认 0 = 插件内置位置（贴在最底部）；例：-40 则整体上移 40px
QuickSlotY=-71
;拖放命中区垂直微调（像素，正数=命中区下移）。仅当快捷栏移动后「图标显示正常但物品拖不进格子」时才需要。
;默认 0 = 自动跟随 QuickSlotY，正常情况下无需改动。
QuickSlotHitY=0

[skillwindow]
;技能窗 (K) 一页显示的行数：4 = 原版，5 = 压缩在同一高度排 5 行
;5 行版通过把行间距从 40px 压缩到 32px 实现，总高度不变，不需要改动 UIWindow.img。
;列表总滚动高 160px（4x40 = 5x32 = 160），刚好走完五行。
;仅 4 与 5 是合法值，其它值会破坏循环上界。改完切客户端（不用按 F9 重读）立刻生效。
;※ 当 [uiexpand] Enabled=true 时本项被忽略：大UI扩展版已把技能窗撑长到 7 行。
RowsPerPage=5

[uiexpand]
;大 UI 扩展（仓库 / 商店 / 技能窗+组合 / 个人摆摊）功能。由本 DLL 在客户端启动时自动写入。
;效果与「大UI扩展注册机.exe」完全一致，移至任何窗口创建之前自动执行。
;  仓库  — 左 8 行 / 右 7 行      （底图 UIWindow.img/Trunk/backgrnd 需 463x438）
;  商店  — 左右各 8 行            （底图 Shop/backgrnd 需 463x459）
;  技能窗 7 行 + 组合技能 5 行    （技能窗底图 Skill/backgrnd 175x409，组合 207x379）
;  摆摊  — 左右各 8 件 + 聊天区加长 （底图 PersonalShop/backgrnd6 需 525x673）
;※ 开启后，配合对应的 WZ 底图视觉效果最佳。
;改完需重启客户端生效。
Enabled=true

[flashjump]
; 自动ALT 双击 + 按住【↑】直冲上跳
; 由本 DLL 直接在客户端内存安装跳板代码，不再需要外部注入工具与按键精灵
;   • CUserLocal::Jump@0x0094C387  双击跳跃 ➔ 自动施放技能 4111006（二段跳，在 250ms 窗口内）
;   • 4111006 速度计算点@0x0096C031 按住【↑】按跳跃 ➔ 水平速度清零、垂直速度大增 ➔ 垂直直冲上方平台
; 如果想要关闭时，将 AutoFlashJump 改为 false 即可，改完重启客户端生效。
AutoFlashJump=true
; 以下 5 项保留以兼容旧版配置读取
FJJumpKey=18
FJSkillKey=65
FJWindowMs=350
FJHoldMs=30
FJCooldownMs=250

[bosshp]
; Boss 血量显示总开关
Enabled=true
; 是否在血条上方显示千分位当前真实血量数值（如 1,234,567）
ShowHpValue=true
; 真实血量数字相对于小地图右边缘的水平偏移
BarOffsetX=40
; 真实血量数字的垂直偏移（血条正上方）
BarOffsetY=4
; 百分比数字的垂直偏移（头像正下方）
PercentOffsetY=37

[petbuff]
; 宠物自动施放 Buff 功能总开关（开启后在宠物装备界面显示 6 个技能槽）
petBuff=true
; 提前多少毫秒自动补放 Buff（默认 3000ms = 剩余 3 秒时自动补放）
petAutoBuffLead=3000
; 宠物 Buff 轮询检测周期（毫秒，默认 1000ms）
petAutoBuffTickMs=1000
; 技能角标字体 slot (默认 43)
petSkillSlotFont=43
; 技能角标字号大小 (默认 11)
petSkillSlotFontSize=11
; 技能角标文字颜色（BGR 格式，默认深绿 0x006400）
petSkillSlotFontColor=0x006400
; 技能护盾开关（true = 仅能释放当前角色已习得技能，防止偷渡放未学技能）
petBuffShield=false

[petfood]
; 宠物自动喂食口粮总开关（开启后在宠物装备界面显示专属口粮槽）
petFood=true
; 宠物自动喂食饥饿度阈值（当满腹度低于该数值时自动使用口粮，默认 50，有效范围 1-100）
petFoodHunger=50
; 是否允许任意宠物食用通用宠物食品（默认 true）
petFoodGeneric=true
; 是否使用真实 WZ 道具图标绘制槽位（默认 true）
petFoodIcon=true
; 是否在口粮槽位内显示道具 ID（默认 false，仅调试用）
petFoodShowItemId=false

[optional]
;物理攻击 面板上限
setDamageCap=9999999
;魔攻/魔防 面板上限
setMAtkCap=9999
;命中上限
setAccCap=9999
;回避上限
setAvdCap=9999
;真实输出上限（只影响伤害数字的显示值；角色能力窗口的宽/窄几何与它无关，那是编译期常量 BEIDOU_WIDE_STATWND）
setAtkOutCap=9999999
;移速上限
speedMovementCap=140
;跳跃上限
jumpCap=123
;爬绳速度自适应：true=随移动速度变化；false=固定值
climbSpeedAuto=false
;爬绳基础速度系数
climbSpeed=1.0
;一种超级机制，不开启的话，升级属性点/技能点会停顿1秒，宠物捡取时攻击会停下来
useTubi=true
;did you wz edit UI/Login.img/Common/frame to something else and are using it?(true/false, default false)
ownLoginFrame=false
;did you wz edit the cashshop backgrnd(s) to something else and are using it?(true/false, default false)
ownCashShopFrame=false
; 允许重复发言相同内容
talkRepeat=false
; 连续说话限制 (毫秒)
talkTime=2000

;================ 战斗注入（基址侧专项，非紫陌功能）================
;伤害注入(0x790586): 0=关 1=只乘 2=乘+打点
damageInject=2
;打点行数上限（正数：只计被放大的行；本次会话第一刀必打）
;负数：打印每一行含 no-op 行，上限取绝对值。测原生暴击用 -60
damageProbe=-300
;注入落点位掩码：1=PDamage 2=C1 4=C3 8=C4（15=全开；另两个嵌套的严禁注入）
damageSites=3
;暴击模式：0=关 1=旧逐段掷点 2=原生入口加算 3=2+暗杀全段(推荐)
;只在 DLL_PROCESS_ATTACH 读一次：改这里必须完全退出客户端再重进
damageCrit=3
;影分身近战适用（420 短刀等，PDamage 补分身行）
shadowMelee=1
;影分身上层播报：段数翻倍（0x951C0C/0x954C63），服务端需接受 2n 行
shadowBcast=1
;金钱炸弹(4211006)接入聚合终伤/暴击（0x792134）
mesoFinal=1
;金钱攻击(4111004)叠加原生暴击：自己的 10% 打底 + 共享槽
mesoAttack=1
;4111004 暴伤：-1=跟随 WZ 的 x（当前 50 即 x1.5）；>0=固定值；0=不补
mesoAttackCd=-1
;暴击增量口径：1=按活值 dmg*cd/100（修暗杀第四刀暴击偏低）；0=原版快照
critFix=1
;暗杀(4221001)叠加武器系原生基底：短刀=0，爪/弓/弩/拳套有效
assassinNative=1

; 右上角 HUD Buff 图标剩余时间倒计时总开关（绿字>=1分钟，黄字<1分钟，黑描边）
buffTimer=true
; 倒计时字号大小
buffTimerSize=14
; 超过多少分钟不显示倒计时（默认 10 分钟）
buffTimerMaxMinutes=10
; >=1分钟 字体颜色（RGB 格式，默认绿色 0x5AFFAA）
buffTimerMinuteColor=0x5AFFAA
; <1分钟 字体颜色（RGB 格式，默认黄色 0xFFFF20）
buffTimerSecondColor=0xFFFF20
; 描边颜色（默认黑色 0x000000）
buffTimerOutlineColor=0x000000
; 倒计时相对于 Buff 图标的 X 偏移（像素）
buffTimerX=4
; 倒计时相对于 Buff 图标的 Y 偏移（像素）
buffTimerY=17

; 消息提示框（经验/捡物提示）整体垂直偏移（像素，正数下移、负数上移）。
; 与 QuickSlotY 配合：你把快捷栏上移多少，就把这里设成同样的负数，提示框就会跟着上移、不再和快捷栏重叠。
; 默认 -71（= 上移一个快捷栏高度）。改完存盘 -> 切回游戏按一下下面的 ReloadKey 立刻生效，不用重启。
MsgBoxYOffset=-71
; 各种"请求类"气泡提示（组队邀请、好友申请、公会邀请、交易申请、任务完成、组队任务可接…共 13 种）
; 的水平位置。它们的 X 是气泡的【左边缘】，13 个共用下面这个"基准 + 微调"。
; 基准模式（换分辨率就偏移的修复点）：
;   center = 以屏幕【水平中心】为基准（推荐）。1280x720 / 1366x768 / 1600x900 / 1920x1080 /
;            1024x768 / 800x600 六种分辨率下，气泡的相对位置一致；800 宽下算得 453，与原版
;            自己的 464 只差 11px —— 说明原版本来就是按"屏幕中心 + 常量"排的。
;   right  = 旧算法：距【右边缘】固定 817px。边距不随分辨率缩放，只有 1600 宽下才好看。
NoticeAnchor=center
; 微调（像素，正数=右移），13 个气泡一起移动。改完按 ReloadKey 生效。
NoticeXOffset=0
; 交易申请气泡单独的水平位置（像素，气泡【左边缘】的绝对值）。
; 注意：原版里这 13 个站点是同一个值（mov edx,0x1D0 = 464），交易气泡并无特殊待遇，
; 早年那个 423 是本插件自己写死的数，所以才显得偏左。
;   423 = 插件旧样（1600 宽下比其它气泡靠左约 360px，不推荐）
;   -1  = 与另外 12 个共用上面的 NoticeAnchor / NoticeXOffset（推荐）
;   其它 = 直接指定左边缘坐标，NoticeXOffset 仍会叠加在它上面。
TradeBalloonX=-1
; 热键：在游戏里按这个键 = 重新读取 config.ini 并立刻重排界面（不用重启客户端）。120 = F9，0 = 关闭。
; 改完某个数值 -> 存盘 -> 按一下这个键 -> 再触发一次新气泡即可看到效果（已在屏幕上的气泡不会动）。
ReloadKey=120
; 背包装备对比：开启后，鼠标悬停在背包中的装备上时，会像便利商店一样显示与身上已穿装备的并排对比图（true=启用，false=关闭）
; 说明：走的是「提示框层」实现 —— 在背包唯一的提示框调用点（0x008F5D73）把单面板调用换成双面板调用。
;       悬停的装备若身上同部位没有对应的已穿装备，则自动回退为原生单面板（不会报错）。
equipCompareInInventory=true
; 背包装备对比（旧实验版 v1，CUIItem 层，hook 落在 0x0083F512）：9-12 的实验已证明它装上不崩但画不出对比，
; 原因是它预构造的静态 CUIItem 缺少 GetBodyPart 所需的 WZ 字段。默认关闭，仅作留档。true=启用旧实现
equipCompareLegacy=false

;怀旧岛ASM版自选优化（R42：这 4 个是玩法改动类 exe 字节 patch，从紫陌 dll 反推）
; 重要：融合版默认全部关闭(false)，与 R41 基线行为一致；紫陌原版默认 true。
; 每项开启前会校验 exe 原始字节，客户端版本不符会自动跳过（不会崩）。
; 开启需完全重启客户端（只在 DLL 加载时读一次）。请逐项上机验证后再长期开启。
; 远程职业近战攻击时不会挥拳（true=不挥拳；exe 0x009516C3 je->jns）
banFist=false
; 加强下水道职业（5 处 patch：一出双击无视地形、取消贯骨蓄力、
; 降低回马硬直/回马CD/升龙内置CD；已含 0405 落叶斩修复）
StrengthenSewer=false
; 攻击不停（true=攻击不停；exe 0x009536E0 jle->jmp）
unStopAttack=false
; 高转技能学习不检查低转技能点是否不足（true=方便转生/偷技能；
; exe 0x008AD01A je->jmp 0x008AD227）
unlockSP=false

;天气与昼夜系统（原版 dll 独有，紫陌骨架缺这 5 个键）
weather=true
;装备对比诊断开关：true = 只装 hook + 打日志，跳过对比逻辑
equipCompareHookOnly=false
;hook 安装方式：0=裸写补丁 1=不补丁(诊断) 2=Detours
equipCompareHookMode=0
equipComparePanelMode=0
equipCompareExitTrace=false

[debug]
debug=false
;免密模式，解除客户端密码限制（须先开启debug）
noPassword=false
;宠物 Buff / 口粮 诊断日志（true = 在游戏根目录写入 petbuff.log / ijlfood.log，调试完毕后建议关闭）
petbuffLog=false
